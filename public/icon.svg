<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing Hexagon / Shield -->
  <polygon points="256,70 410,150 410,340 256,430 102,340 102,150" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- QA Letters & Flame -->
  <text x="256" y="275" font-family="sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-4">QA</text>
  <text x="256" y="345" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="url(#emeraldGrad)" letter-spacing="8">CONCURSOS</text>

  <!-- Small Crown/Star on top -->
  <path d="M 236 120 L 256 95 L 276 120 L 296 105 L 286 140 L 226 140 L 216 105 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>
